# This registry records data provenance before anything is downloaded or merged.
# `commercial_allowed = false` does not prevent research experiments, but those
# samples must remain separable from data intended for a distributable product.

[[sources]]
id = "infactory_ball_tracking"
name = "Infactory Soccer Ball Tracking"
url = "https://huggingface.co/datasets/infactory-ai/ball-tracking"
kind = "images"
domain = "professional_broadcast"
annotations = "yolo_ball_bbox_with_negative_frames"
access = "public"
data_license = "CC-BY-NC-4.0"
commercial_allowed = false
status = "prepared_v001_visual_qa_failed"
notes = "The card claims 1450 frames from 10 clips, but revision 75854a5 contains 7152 data images from 54 UUID sequences. The conservative v001 excludes 75 zero-area annotations and 63 multi-box frames, keeps sequences in a single split, and contains no exact duplicate. A stratified 60-image visual QA still found four confirmed false-positive boxes and one false-negative frame. A 700-image priority queue now covers large boxes, temporal discontinuities, and the confirmed errors. Broadcast domain, not a fixed amateur sideline camera."

[[sources]]
id = "soccereye"
name = "SoccerEye custom detector dataset"
url = "https://github.com/WWandP/SoccerEye"
kind = "images"
domain = "mixed_soccer_scenes"
annotations = "yolo_person_and_ball_bbox"
access = "public_google_drive"
data_license = "unknown"
commercial_allowed = false
status = "blocked_license_review"
notes = "Downloaded for local research. Archive has 1128 processed images derived from only 560 unique scene names and 15 source prefixes. All 15 sources cross the published splits; 53 scene names also cross splits. Code is MIT, but dataset license remains unspecified."

