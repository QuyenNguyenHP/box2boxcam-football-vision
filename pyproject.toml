[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "box2boxcam"
version = "0.1.0"
description = "Data, training and evaluation pipeline for low-cost automatic football camera tracking (ball detection)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.4,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
training = [
  "ultralytics==8.4.153",
  "torch>=2.4",
  "numpy>=1.26",
  "opencv-python>=4.10,<5",
]
benchmark = [
  "ultralytics==8.4.153",
  "torch>=2.4",
  "numpy>=1.26",
  "opencv-python>=4.10,<5",
  "scipy>=1.11",
]
dev = [
  "ruff>=0.12",
]
notebook = [
  "ipympl>=0.9,<1",
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
]
annotation = [
  "openai>=2,<3",
  "opencv-python>=4.10,<5",
  "python-dotenv>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/box2boxcam"]

[tool.ruff]
line-length = 88
target-version = "py311"
